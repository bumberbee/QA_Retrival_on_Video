<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiểm tra ranh giới slide</title>
<style>
:root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#667085; --line:#d9dde5;
        --ok:#1f9d55; --bad:#d64545; --warn:#c77700; --blue:#2f6fde; }
* { box-sizing:border-box; }
body { margin:0; font:14px/1.45 system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
header { position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--line); padding:10px 16px; }
h1 { font-size:17px; margin:0 0 6px; }
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.tabs button, .tools button, select, input { font:inherit; padding:4px 9px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
.tabs button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
.tabs small { color:var(--muted); }
.tabs button.on small { color:#cfd5e0; }
.legend { color:var(--muted); font-size:12.5px; margin-top:6px; }
.legend b { color:var(--ink); }
main { padding:12px 16px 80px; max-width:1200px; margin:auto; }
.summary { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:12px; }
.card { background:var(--card); border:1px solid var(--line); border-left:5px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:10px; }
.card.ok { border-left-color:var(--ok); }
.card.bad { border-left-color:var(--bad); }
.card.focus { outline:2px solid var(--blue); }
.head { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:6px; }
.tag { font-size:12px; padding:1px 7px; border-radius:10px; background:#eef1f6; }
.tag.slide { background:#fde4e4; color:#9b1c1c; }
.tag.reveal { background:#e1ecff; color:#1e4fa8; }
.tag.missed { background:#fff1d6; color:#8a5300; }
.tag.dis { background:var(--warn); color:#fff; }
.imgs { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.imgs figure { margin:0; }
.imgs img { width:100%; border-radius:4px; border:1px solid var(--line); cursor:zoom-in; display:block; }
.imgs figcaption { font-size:12px; color:var(--muted); }
.note { color:var(--muted); font-size:12.5px; }
.acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; align-items:center; }
.acts button { font:inherit; padding:4px 12px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; }
.acts .yes.on { background:var(--ok); color:#fff; border-color:var(--ok); }
.acts .no.on { background:var(--bad); color:#fff; border-color:var(--bad); }
#zoom { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:9; }
#zoom img { max-width:96vw; max-height:92vh; }
table { border-collapse:collapse; font-size:13px; }
td, th { border:1px solid var(--line); padding:3px 8px; text-align:right; }
th:first-child, td:first-child { text-align:left; }
@media (max-width:640px) { .imgs { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>Bộ 1: ranh giới slide (bản nháp, cần người kiểm tra)</h1>
  <div class="row tabs" id="tabs"></div>
  <div class="row tools" style="margin-top:6px">
    <label>Lọc <select id="filter">
      <option value="all">Tất cả</option>
      <option value="todo">Chưa kiểm tra</option>
      <option value="dis">Pipeline khác nhãn của Claude</option>
      <option value="bad">Đã đánh dấu sai</option>
    </select></label>
    <button id="add">+ Thêm ranh giới bị sót</button>
    <button id="export">Xuất JSON</button>
    <label style="cursor:pointer">Nhập JSON <input type="file" id="import" accept=".json" style="display:none"></label>
    <span class="note">Phím: J/K = xuống/lên, Enter = Đúng, 1–6 = đổi nhãn (S R SC C L X)</span>
  </div>
  <div class="legend" id="legend"></div>
</header>
<main>
  <div class="summary" id="summary"></div>
  <div id="list"></div>
</main>
<div id="zoom"><img alt=""></div>
<script>
const DATA = /*DATA*/null;
const CODES = ["S", "R", "SC", "C", "L", "X"];
const KEY = "gold-boundaries-v1";
let state;
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { state = {}; }
// state[video] = { events: [{label, status}], added: [{time_sec, label, note}] }
let current = DATA.videos[0].video, focus = 0;

function vstate(v) {
  if (!state[v.video]) state[v.video] = { events: v.events.map(e => ({ label: e.label, status: "" })), added: [] };
  return state[v.video];
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }
function clock(s) { const m = Math.floor(s / 60); return m + ":" + (s - 60 * m).toFixed(1).padStart(4, "0"); }
function disagree(e, label) {
  if (e.pipeline === "missed") return "pipeline bỏ sót";
  if (e.pipeline === "slide" && (label === "R" || label === "X")) return "tách thừa";
  if (e.pipeline === "reveal" && (label === "S" || label === "C")) return "gộp nhầm";
  return "";
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

document.getElementById("legend").innerHTML = Object.entries(DATA.legend).map(([k, v]) => `<b>${k}</b> ${esc(v)}`).join(" · ") +
  " — Đỏ = pipeline coi là slide mới, xanh = pipeline gộp (hiện dần), vàng = pipeline bỏ sót (Claude tìm thêm).";

function renderTabs() {
  document.getElementById("tabs").innerHTML = DATA.videos.map(v => {
    const s = vstate(v), done = s.events.filter(e => e.status).length;
    return `<button data-v="${v.video}" class="${v.video === current ? "on" : ""}">${v.video.slice(4)} <small>${done}/${s.events.length} · ${v.split === "tuning" ? "tuning" : "test"}</small></button>`;
  }).join("");
}
function renderSummary() {
  const rows = DATA.videos.map(v => {
    const s = vstate(v), c = { "tách thừa": 0, "gộp nhầm": 0, "pipeline bỏ sót": 0 };
    v.events.forEach((e, i) => { const d = disagree(e, s.events[i].label); if (d) c[d]++; });
    c["pipeline bỏ sót"] += s.added.length;
    const bad = s.events.filter(e => e.status === "bad").length;
    return `<tr><td>${v.video} (${v.split === "tuning" ? "tuning" : "test"})</td><td>${v.events.length}</td><td>${c["tách thừa"]}</td><td>${c["gộp nhầm"]}</td><td>${c["pipeline bỏ sót"]}</td><td>${s.events.filter(e => e.status).length}</td><td>${bad}</td></tr>`;
  }).join("");
  document.getElementById("summary").innerHTML = `<b>Pipeline so với nhãn hiện tại</b> (cập nhật theo nhãn bạn sửa)
    <div style="overflow-x:auto"><table><tr><th>Video</th><th>Sự kiện</th><th>Tách thừa</th><th>Gộp nhầm</th><th>Bỏ sót</th><th>Đã kiểm</th><th>Claude sai</th></tr>${rows}</table></div>
    <div class="note">Tách thừa: pipeline tách slide mới nhưng thật ra là cùng slide (R/X). Gộp nhầm: pipeline gộp nhưng thật ra là slide mới hoặc chuyển cảnh (S/C). L và SC chưa tính là lỗi: cần quyết định có tách hay không.</div>`;
}
function renderList() {
  const v = DATA.videos.find(x => x.video === current), s = vstate(v), f = document.getElementById("filter").value;
  const cards = v.events.map((e, i) => {
    const st = s.events[i], d = disagree(e, st.label);
    if (f === "todo" && st.status) return "";
    if (f === "dis" && !d) return "";
    if (f === "bad" && st.status !== "bad") return "";
    const pipe = { slide: "pipeline: slide mới", reveal: "pipeline: gộp (hiện dần)", missed: "pipeline: bỏ sót" }[e.pipeline];
    return `<div class="card ${st.status} ${i === focus ? "focus" : ""}" data-i="${i}">
      <div class="head"><b>#${i}</b><span>${clock(e.time_sec)}</span><span class="tag ${e.pipeline}">${pipe}</span>
        ${d ? `<span class="tag dis">${d}</span>` : ""}${e.note ? `<span class="note">${esc(e.note)}</span>` : ""}</div>
      <div class="imgs"><figure><img loading="lazy" src="${e.before}" alt="trước"><figcaption>Trước</figcaption></figure>
        <figure><img loading="lazy" src="${e.after}" alt="sau"><figcaption>Sau</figcaption></figure></div>
      <div class="acts">Nhãn: <select data-act="label">${CODES.map(c => `<option ${c === st.label ? "selected" : ""} value="${c}">${c}: ${esc(DATA.legend[c])}</option>`).join("")}</select>
        ${st.label !== e.label ? `<span class="note">(Claude: ${e.label})</span>` : ""}
        <button class="yes ${st.status === "ok" ? "on" : ""}" data-act="ok">Đúng</button>
        <button class="no ${st.status === "bad" ? "on" : ""}" data-act="bad">Claude sai</button></div></div>`;
  }).join("");
  const added = s.added.map((a, k) => `<div class="card ok"><div class="head"><b>Thêm ${k + 1}</b><span>${clock(a.time_sec)}</span>
      <span class="tag missed">bạn thêm</span><span>${a.label}</span><span class="note">${esc(a.note || "")}</span>
      <button data-del="${k}">Xoá</button></div></div>`).join("");
  document.getElementById("list").innerHTML = cards + added;
}
function render() { renderTabs(); renderSummary(); renderList(); save(); }

document.getElementById("tabs").onclick = ev => {
  const b = ev.target.closest("button"); if (!b) return;
  current = b.dataset.v; focus = 0; render(); window.scrollTo(0, 0);
};
document.getElementById("filter").onchange = renderList;
document.getElementById("list").addEventListener("click", ev => {
  const img = ev.target.closest("img");
  if (img) { const z = document.getElementById("zoom"); z.querySelector("img").src = img.src; z.style.display = "flex"; return; }
  const v = DATA.videos.find(x => x.video === current), s = vstate(v);
  if (ev.target.dataset.del !== undefined) { s.added.splice(+ev.target.dataset.del, 1); render(); return; }
  const card = ev.target.closest(".card[data-i]"); if (!card) return;
  const i = +card.dataset.i, act = ev.target.dataset.act;
  focus = i;
  if (act === "ok" || act === "bad") { s.events[i].status = s.events[i].status === act ? "" : act; render(); }
});
document.getElementById("list").addEventListener("change", ev => {
  if (ev.target.dataset.act !== "label") return;
  const v = DATA.videos.find(x => x.video === current), s = vstate(v), i = +ev.target.closest(".card").dataset.i;
  s.events[i].label = ev.target.value;
  s.events[i].status = ev.target.value === v.events[i].label ? s.events[i].status : "bad";
  render();
});
document.getElementById("zoom").onclick = () => document.getElementById("zoom").style.display = "none";
document.getElementById("add").onclick = () => {
  const box = document.createElement("div");
  box.className = "card";
  box.innerHTML = `Thời điểm (m:ss hoặc giây) <input id="at" size="8"> Nhãn <select id="al">${CODES.map(c => `<option>${c}</option>`).join("")}</select>
    Ghi chú <input id="an" size="30"> <button id="ok">Thêm</button>`;
  document.getElementById("list").prepend(box);
  box.querySelector("#ok").onclick = () => {
    const raw = box.querySelector("#at").value.trim(), p = raw.split(":");
    const t = p.length === 2 ? +p[0] * 60 + +p[1] : +raw;
    if (!isFinite(t)) return;
    vstate(DATA.videos.find(x => x.video === current)).added.push({ time_sec: t, label: box.querySelector("#al").value, note: box.querySelector("#an").value });
    render();
  };
};
document.getElementById("export").onclick = () => {
  const out = { legend: DATA.legend, exported: new Date().toISOString(), videos: DATA.videos.map(v => {
    const s = vstate(v);
    return { video: v.video, split: v.split,
      events: v.events.map((e, i) => ({ time_sec: e.time_sec, pipeline: e.pipeline, claude_label: e.label, label: s.events[i].label, status: s.events[i].status || "unchecked" }))
        .concat(s.added.map(a => ({ time_sec: a.time_sec, pipeline: "missed", claude_label: null, label: a.label, status: "added", note: a.note }))) };
  }) };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: "application/json" }));
  a.download = "slide_boundaries_checked.json"; a.click();
};
document.getElementById("import").onchange = async ev => {
  const file = ev.target.files[0]; if (!file) return;
  const data = JSON.parse(await file.text());
  data.videos.forEach(dv => {
    const v = DATA.videos.find(x => x.video === dv.video); if (!v) return;
    const s = vstate(v), own = dv.events.filter(e => e.status !== "added");
    own.forEach((e, i) => { if (s.events[i]) { s.events[i].label = e.label; s.events[i].status = e.status === "unchecked" ? "" : e.status; } });
    s.added = dv.events.filter(e => e.status === "added").map(e => ({ time_sec: e.time_sec, label: e.label, note: e.note }));
  });
  render();
};
document.addEventListener("keydown", ev => {
  if (["INPUT", "SELECT"].includes(document.activeElement.tagName)) return;
  const v = DATA.videos.find(x => x.video === current), s = vstate(v), n = v.events.length;
  if (ev.key === "j" || ev.key === "k") focus = Math.max(0, Math.min(n - 1, focus + (ev.key === "j" ? 1 : -1)));
  else if (ev.key === "Enter") { s.events[focus].status = "ok"; focus = Math.min(n - 1, focus + 1); }
  else if (/^[1-6]$/.test(ev.key)) { s.events[focus].label = CODES[+ev.key - 1]; if (s.events[focus].label !== v.events[focus].label) s.events[focus].status = "bad"; }
  else return;
  ev.preventDefault(); render();
  document.querySelector(`.card[data-i="${focus}"]`)?.scrollIntoView({ block: "center" });
});
render();
</script>
</body>
</html>
